<script type="importmap">

<script type="module">

import * as THREE from "three";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


// ============================================================
// BASIC SETTINGS
// ============================================================

const EARTH_RADIUS = 2;

// IMPORTANT:
// Santa's CENTER stays at this radius.
// Earth surface = 2
// Santa = 2.85
//
// This gives Santa plenty of space above the Earth.
const SANTA_RADIUS = 2.85;

// Smaller number = smaller Santa.
// The previous version used about 0.65.
// This version uses 0.20.
const SANTA_SIZE = 0.20;

// How long Santa takes between locations.
// 45 seconds = slow NORAD-style test movement.
const SEGMENT_DURATION = 45000;


// ============================================================
// PAGE ELEMENTS
// ============================================================

const status = document.getElementById("location");


// ============================================================
// THREE.JS SCENE
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020914);


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    1000
);

camera.position.set(0, 1.2, 6.5);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


// ============================================================
// CAMERA CONTROLS
// ============================================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.minDistance = 4;

controls.maxDistance = 12;


// ============================================================
// LIGHTING
// ============================================================

const hemisphereLight = new THREE.HemisphereLight(
    0xffffff,
    0x303030,
    2.5
);

scene.add(hemisphereLight);


const sunLight = new THREE.DirectionalLight(
    0xffffff,
    4
);

sunLight.position.set(
    5,
    8,
    5
);

scene.add(sunLight);


// ============================================================
// EARTH
// ============================================================

const earthGeometry = new THREE.SphereGeometry(
    EARTH_RADIUS,
    96,
    96
);

const earthTexture = new THREE.TextureLoader().load(
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);

earthTexture.colorSpace = THREE.SRGBColorSpace;


const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthTexture
});


const earth = new THREE.Mesh(
    earthGeometry,
    earthMaterial
);

scene.add(earth);


// ============================================================
// ATMOSPHERE
// ============================================================

const atmosphereGeometry = new THREE.SphereGeometry(
    EARTH_RADIUS + 0.06,
    64,
    64
);

const atmosphereMaterial = new THREE.MeshBasicMaterial({
    color: 0x4fa8ff,
    transparent: true,
    opacity: 0.10,
    side: THREE.BackSide
});

const atmosphere = new THREE.Mesh(
    atmosphereGeometry,
    atmosphereMaterial
);

scene.add(atmosphere);


// ============================================================
// SANTA ROUTE
//
// The route moves generally from the earliest Christmas
// time zones toward the later ones.
//
// This is a TEST route, not a boundary-perfect time-zone map.
// ============================================================

const route = [

    {
        name: "International Date Line",
        lat: 66,
        lon: 180,
        zone: "UTC+14 / UTC+13"
    },

    {
        name: "New Zealand",
        lat: -41.3,
        lon: 174.8,
        zone: "UTC+12"
    },

    {
        name: "Australia",
        lat: -33.9,
        lon: 151.2,
        zone: "UTC+11"
    },

    {
        name: "Japan",
        lat: 35.7,
        lon: 139.7,
        zone: "UTC+9"
    },

    {
        name: "South Korea",
        lat: 37.5,
        lon: 127.0,
        zone: "UTC+9"
    },

    {
        name: "China",
        lat: 39.9,
        lon: 116.4,
        zone: "UTC+8"
    },

    {
        name: "India",
        lat: 28.6,
        lon: 77.2,
        zone: "UTC+5:30"
    },

    {
        name: "Middle East",
        lat: 25.3,
        lon: 55.3,
        zone: "UTC+4"
    },

    {
        name: "Europe",
        lat: 51.5,
        lon: -0.1,
        zone: "UTC+0"
    },

    {
        name: "West Africa",
        lat: 6.5,
        lon: 3.4,
        zone: "UTC+1"
    },

    {
        name: "Brazil",
        lat: -23.5,
        lon: -46.6,
        zone: "UTC-3"
    },

    {
        name: "Puerto Rico",
        lat: 18.2,
        lon: -66.5,
        zone: "UTC-4"
    },

    {
        name: "Dominican Republic",
        lat: 18.7,
        lon: -70.2,
        zone: "UTC-4"
    },

    {
        name: "Eastern United States",
        lat: 38.9,
        lon: -77.0,
        zone: "UTC-5"
    },

    {
        name: "Central United States",
        lat: 41.9,
        lon: -87.6,
        zone: "UTC-6"
    },

    {
        name: "Mountain United States",
        lat: 39.7,
        lon: -104.9,
        zone: "UTC-7"
    },

    {
        name: "Western United States",
        lat: 34.0,
        lon: -118.2,
        zone: "UTC-8"
    },

    {
        name: "Alaska",
        lat: 61.2,
        lon: -149.9,
        zone: "UTC-9"
    },

    {
        name: "Hawaii",
        lat: 21.3,
        lon: -157.8,
        zone: "UTC-10"
    },

    {
        name: "North Pole",
        lat: 89,
        lon: 0,
        zone: "Polar"
    }

];


// ============================================================
// CONVERT LAT/LON TO 3D POSITION
// ============================================================

function latLonToVector3(
    lat,
    lon,
    radius
) {

    const phi =
        (90 - lat) * Math.PI / 180;

    const theta =
        (lon + 180) * Math.PI / 180;

    const x =
        -radius *
        Math.sin(phi) *
        Math.cos(theta);

    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    const y =
        radius *
        Math.cos(phi);

    return new THREE.Vector3(
        x,
        y,
        z
    );
}


// ============================================================
// HANDLE DATE LINE WRAP
// ============================================================

function interpolateLongitude(
    lon1,
    lon2,
    amount
) {

    let difference = lon2 - lon1;

    if (difference > 180) {
        difference -= 360;
    }

    if (difference < -180) {
        difference += 360;
    }

    let result =
        lon1 +
        difference * amount;

    if (result > 180) {
        result -= 360;
    }

    if (result < -180) {
        result += 360;
    }

    return result;
}


// ============================================================
// SANTA MODEL
// ============================================================

let santaModel = null;

let currentSegment = 0;

let segmentStartTime = performance.now();


// ============================================================
// LOAD GLB
// ============================================================

const loader = new GLTFLoader();

loader.load(

    "santa_-_norad_santa_tracker.glb",

    function(gltf) {

        console.log("🎅 SANTA GLB LOADED!");

        santaModel = gltf.scene;


        // ----------------------------------------------------
        // FIND MODEL SIZE
        // ----------------------------------------------------

        const box =
            new THREE.Box3()
            .setFromObject(santaModel);

        const size =
            box.getSize(
                new THREE.Vector3()
            );

        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        // ----------------------------------------------------
        // CENTER THE MODEL
        // ----------------------------------------------------

        santaModel.position.x -= center.x;

        santaModel.position.y -= center.y;

        santaModel.position.z -= center.z;


        // ----------------------------------------------------
        // MAKE SANTA SMALL
        // ----------------------------------------------------

        const largest =
            Math.max(
                size.x,
                size.y,
                size.z
            );

        const scale =
            SANTA_SIZE / largest;

        santaModel.scale.setScalar(scale);


        // ----------------------------------------------------
        // MAKE ALL MESHES RENDER
        // ----------------------------------------------------

        santaModel.traverse(
            function(object) {

                if (object.isMesh) {

                    object.frustumCulled = false;

                }

            }
        );


        // ----------------------------------------------------
        // ADD SANTA TO SCENE
        // ----------------------------------------------------

        scene.add(santaModel);


        // Put Santa at the first route point.
        const start =
            route[0];

        const startPosition =
            latLonToVector3(
                start.lat,
                start.lon,
                SANTA_RADIUS
            );

        santaModel.position.copy(
            startPosition
        );


        status.innerHTML =
            "🎅 Santa is flying!<br>" +
            "<span style='color:#aaa'>" +
            start.name +
            " • " +
            start.zone +
            "</span>";


        console.log(
            "Santa scale:",
            scale
        );

        console.log(
            "Santa radius:",
            SANTA_RADIUS
        );

    },

    function(progress) {

        if (progress.total) {

            const percent =
                Math.round(
                    progress.loaded /
                    progress.total *
                    100
                );

            status.textContent =
                "🎅 Loading Santa... " +
                percent +
                "%";

        }

    },

    function(error) {

        console.error(
            "SANTA GLB ERROR:",
            error
        );

        status.innerHTML =
            "❌ Could not load Santa.<br>" +
            "<span style='font-size:12px'>" +
            "Check that the GLB is beside index.html." +
            "</span>";

    }

);


// ============================================================
// MOVE SANTA
// ============================================================

function updateSanta(
    currentTime
) {

    if (!santaModel) {
        return;
    }


    const start =
        route[currentSegment];

    const nextIndex =
        (currentSegment + 1) %
        route.length;

    const end =
        route[nextIndex];


    // --------------------------------------------------------
    // HOW FAR THROUGH THIS SEGMENT?
    // --------------------------------------------------------

    let progress =
        (currentTime - segmentStartTime) /
        SEGMENT_DURATION;


    // --------------------------------------------------------
    // MOVE TO NEXT LOCATION
    // --------------------------------------------------------

    if (progress >= 1) {

        currentSegment =
            nextIndex;

        segmentStartTime =
            currentTime;

        progress = 0;

    }


    // --------------------------------------------------------
    // SMOOTH THE MOVEMENT
    // --------------------------------------------------------

    const smoothProgress =
        progress * progress *
        (3 - 2 * progress);


    // --------------------------------------------------------
    // INTERPOLATE LATITUDE
    // --------------------------------------------------------

    const lat =
        start.lat +
        (end.lat - start.lat) *
        smoothProgress;


    // --------------------------------------------------------
    // INTERPOLATE LONGITUDE
    // --------------------------------------------------------

    const lon =
        interpolateLongitude(
            start.lon,
            end.lon,
            smoothProgress
        );


    // --------------------------------------------------------
    // CURRENT POSITION
    //
    // IMPORTANT:
    // Always use SANTA_RADIUS.
    //
    // This prevents Santa's center from moving into Earth.
    // --------------------------------------------------------

    const position =
        latLonToVector3(
            lat,
            lon,
            SANTA_RADIUS
        );


    santaModel.position.copy(
        position
    );


    // --------------------------------------------------------
    // CALCULATE A POINT A LITTLE AHEAD
    //
    // Used to make the sleigh face the direction
    // it is actually flying.
    // --------------------------------------------------------

    const lookProgress =
        Math.min(
            smoothProgress + 0.01,
            1
        );


    const aheadLat =
        start.lat +
        (end.lat - start.lat) *
        lookProgress;


    const aheadLon =
        interpolateLongitude(
            start.lon,
            end.lon,
            lookProgress
        );


    const aheadPosition =
        latLonToVector3(
            aheadLat,
            aheadLon,
            SANTA_RADIUS
        );


    const direction =
        aheadPosition
        .clone()
        .sub(position)
        .normalize();


    // --------------------------------------------------------
    // POINT SANTA ALONG THE ROUTE
    // --------------------------------------------------------

    if (direction.length() > 0.001) {

        const target =
            position
            .clone()
            .add(direction);

        santaModel.lookAt(target);

    }


    // --------------------------------------------------------
    // UPDATE DISPLAY
    // --------------------------------------------------------

    status.innerHTML =
        "🎅 SANTA IS FLYING<br>" +
        "<span style='color:#ddd'>" +
        start.name +
        "</span><br>" +
        "<span style='color:#888'>" +
        start.zone +
        "</span>";

}


// ============================================================
// ANIMATION LOOP
// ============================================================

function animate(
    currentTime
) {

    requestAnimationFrame(
        animate
    );


    updateSanta(
        currentTime
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}

animate(
    performance.now()
);


// ============================================================
// WINDOW RESIZE
// ============================================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
